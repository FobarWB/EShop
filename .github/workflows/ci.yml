name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# A new push to the same PR cancels the run that is still in progress; runs on master are never cancelled,
# so every merge publishes its images.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    # Throwaway PostgreSQL for the integration tests; the tests create and migrate their own databases.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eshop
          POSTGRES_PASSWORD: eshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__EShopTests: Host=localhost;Port=5432;Database=eshop_test;Username=eshop;Password=eshop
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore EShop.sln
      - run: dotnet build EShop.sln --no-restore
      - run: dotnet test --no-build --coverage --coverage-output-format cobertura

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator \
            "-reports:TestResults/*.cobertura.xml" \
            "-targetdir:TestResults/coverage-report" \
            "-reporttypes:Html;MarkdownSummaryGithub" \
            "-assemblyfilters:+EShop.*;-EShop.*.Tests.*;-EShop.Tests.Common" \
            "-classfilters:-EShop.Data.Migrations.*;-Microsoft.AspNetCore.OpenApi.Generated*;-System.Runtime.CompilerServices*"
          cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results
          path: TestResults/

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/EShop.ClientApp

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/EShop.ClientApp/package-lock.json

      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false

  # Docker images of the shop: built on every run (a broken Dockerfile fails the PR),
  # pushed to ghcr.io only from master, after the tests passed.
  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: productapi
            dockerfile: src/EShop.ProductApi/Dockerfile
          - name: categoryapi
            dockerfile: src/EShop.CategoryApi/Dockerfile
          - name: shoppingcart
            dockerfile: src/EShop.ShoppingCart/Dockerfile
          - name: orderapi
            dockerfile: src/EShop.OrderApi/Dockerfile
          - name: client
            dockerfile: src/EShop.ClientApp/Dockerfile
          - name: migrator
            dockerfile: src/EShop.Data/Dockerfile

    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags sha-<short commit> (immutable) and latest (master only); OCI labels link the package to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fobarwb/eshop-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the GitHub Actions cache, one scope per image so they do not overwrite each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
