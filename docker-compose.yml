# Local environment.
#   docker compose up -d                          PostgreSQL and pgAdmin (run the APIs and the client from the IDE)
#   docker compose --profile app up -d --build    the whole shop on http://localhost:8080
#   ESHOP_TAG=latest (or sha-<commit>): docker compose --profile app pull, then up -d --no-build
#                                                 runs the images published by CI instead of local builds
#   docker compose --profile app down            stop everything (data stays in the named volumes)
name: eshop

# Shared settings of the API containers (YAML anchor, merged with <<: below).
x-api: &api
  profiles: [app]
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    # Host "postgres" is the service name on the compose network. GSSAPI is off: the .NET images have no Kerberos library.
    ConnectionStrings__EShop: Host=postgres;Port=5432;Database=eshop;Username=eshop;Password=${ESHOP_DB_PASSWORD};GssEncryptionMode=Disable
  depends_on:
    migrator:
      condition: service_completed_successfully
  restart: unless-stopped
  healthcheck:
    # The aspnet image has no curl or wget: bash opens a TCP connection and sends a minimal HTTP request.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ESHOP_DB_PASSWORD: ${ESHOP_DB_PASSWORD:?Set ESHOP_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 keeps its data in /var/lib/postgresql/18/docker; mounting the parent lets a future
      # major version (19) live next to it for pg_upgrade.
      - postgres-data:/var/lib/postgresql
      # Runs once, on the first start with an empty volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Identity provider (OpenID Connect): issues the tokens the APIs validate.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    # Development mode; --import-realm creates the realms from /opt/keycloak/data/import if they do not exist yet.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      # One public address, so every token has the same issuer; the APIs in containers reach the
      # keys and endpoints through keycloak:8080 (backchannel addresses follow the request).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Administrator of the master realm (the admin console), created on the first start only.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      # Readiness on the management port 9000; the image has no curl, so bash /dev/tcp as for the APIs.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: applies the EF Core migrations and exits; the APIs start only after it succeeds.
  migrator:
    profiles: [app]
    # Local builds are tagged :local; ESHOP_TAG=latest or sha-<commit> selects the images published by CI.
    image: ghcr.io/fobarwb/eshop-migrator:${ESHOP_TAG:-local}
    build:
      context: .
      dockerfile: src/EShop.Data/Dockerfile
    environment:
      ConnectionStrings__EShop: Host=postgres;Port=5432;Database=eshop;Username=eshop;Password=${ESHOP_DB_PASSWORD};GssEncryptionMode=Disable
    depends_on:
      postgres:
        condition: service_healthy

  productapi:
    <<: *api
    image: ghcr.io/fobarwb/eshop-productapi:${ESHOP_TAG:-local}
    build:
      context: .
      dockerfile: src/EShop.ProductApi/Dockerfile

  categoryapi:
    <<: *api
    image: ghcr.io/fobarwb/eshop-categoryapi:${ESHOP_TAG:-local}
    build:
      context: .
      dockerfile: src/EShop.CategoryApi/Dockerfile

  shoppingcart:
    <<: *api
    image: ghcr.io/fobarwb/eshop-shoppingcart:${ESHOP_TAG:-local}
    build:
      context: .
      dockerfile: src/EShop.ShoppingCart/Dockerfile

  # nginx: the only shop service published to the host; it serves the client and proxies /api to the APIs.
  client:
    profiles: [app]
    image: ghcr.io/fobarwb/eshop-client:${ESHOP_TAG:-local}
    build:
      context: .
      dockerfile: src/EShop.ClientApp/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      productapi:
        condition: service_healthy
      categoryapi:
        condition: service_healthy
      shoppingcart:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
