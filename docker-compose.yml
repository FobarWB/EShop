# Local environment.
#   docker compose up -d                          PostgreSQL and pgAdmin (run the APIs and the client from the IDE)
#   docker compose --profile app up -d --build    the whole shop on http://localhost:8080
#   docker compose --profile app down             stop everything (data stays in the named volumes)
name: eshop

# Shared settings of the API containers (YAML anchor, merged with <<: below).
x-api: &api
  profiles: [app]
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    # Host "postgres" is the service name on the compose network. GSSAPI is off: the .NET images have no Kerberos library.
    ConnectionStrings__EShop: Host=postgres;Port=5432;Database=eshop;Username=eshop;Password=${ESHOP_DB_PASSWORD};GssEncryptionMode=Disable
  depends_on:
    migrator:
      condition: service_completed_successfully
  restart: unless-stopped
  healthcheck:
    # The aspnet image has no curl or wget: bash opens a TCP connection and sends a minimal HTTP request.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ESHOP_DB_PASSWORD: ${ESHOP_DB_PASSWORD:?Set ESHOP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 keeps its data in /var/lib/postgresql/18/docker; mounting the parent lets a future
      # major version (19) live next to it for pg_upgrade.
      - postgres-data:/var/lib/postgresql
      # Runs once, on the first start with an empty volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: applies the EF Core migrations and exits; the APIs start only after it succeeds.
  migrator:
    profiles: [app]
    build:
      context: .
      dockerfile: src/EShop.Data/Dockerfile
    environment:
      ConnectionStrings__EShop: Host=postgres;Port=5432;Database=eshop;Username=eshop;Password=${ESHOP_DB_PASSWORD};GssEncryptionMode=Disable
    depends_on:
      postgres:
        condition: service_healthy

  productapi:
    <<: *api
    build:
      context: .
      dockerfile: src/EShop.ProductApi/Dockerfile

  categoryapi:
    <<: *api
    build:
      context: .
      dockerfile: src/EShop.CategoryApi/Dockerfile

  shoppingcart:
    <<: *api
    build:
      context: .
      dockerfile: src/EShop.ShoppingCart/Dockerfile

  # nginx: the only shop service published to the host; it serves the client and proxies /api to the APIs.
  client:
    profiles: [app]
    build:
      context: .
      dockerfile: src/EShop.ClientApp/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      productapi:
        condition: service_healthy
      categoryapi:
        condition: service_healthy
      shoppingcart:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
