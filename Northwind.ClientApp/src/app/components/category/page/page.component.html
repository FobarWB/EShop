<div class="py-2 bg-light">
  <div class="container">
    <h1 class="pb-3">All products by category «{{ categoryName }}»</h1>
    <div class="row flex-nowrap">
      <div class="col-auto">
        <app-category-side-bar
          (filtersApplied)="onFiltersApplied($event)"
        ></app-category-side-bar>
      </div>
      <div class="col">
        <div>
          <nav class="navbar navbar-light bg-light">
            <div class="container-fluid">
              <span class="navbar-text">
                Found products: {{ products.length }}
              </span>
              <div class="dropdown">
                <button
                  class="btn btn-secondary dropdown-toggle"
                  type="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Sort products
                </button>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" (click)="sortProductsAsc()"
                      >Sort by price ascending</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item" (click)="sortProductsDesc()"
                      >Sort by price descending</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item" (click)="sortByName()"
                      >Sort by name</a
                    >
                  </li>
                </ul>
              </div>
            </div>
          </nav>
        </div>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">

          <div
            class="card border-0 rounded-0 shadow"
            style="width: 18rem"
            *ngFor="let product of filteredProducts"
          >
            <img
              src="images/GYB8b1-WwAAkB9_.jpg"
              class="card-img-top rounded-0"
              alt="..."
            />
            <div class="card-body mt-3 mb-3">
              <div class="row">
                <div class="col-10">
                  <h4 class="card-title">{{ product.productName }}</h4>
                  <p class="card-text">
                    <i class="bi bi-star-fill text-warning"></i>
                    <i class="bi bi-star-fill text-warning"></i>
                    <i class="bi bi-star-fill text-warning"></i>
                    <i class="bi bi-star-fill text-warning"></i>
                    (123)
                  </p>
                </div>
                <div class="col-2">
                  <i class="bi bi-bookmark-plus fs-2"></i>
                </div>
              </div>
            </div>
            <div class="row align-items-center text-center g-0">
              <div class="col-4">
                <h5>
                  {{
                    product.unitPrice ? (product.unitPrice | currency) : "zero"
                  }}
                </h5>
              </div>
              <div class="col-8">
                <a
                  href="#"
                  class="btn btn-dark w-100 p-3 rounded-0 text-warning"
                  >ADD TO CART</a
                >
              </div>
            </div>
          </div>
          <div class="ccol mb-5">
            <div class="card card-empty shadow-sm h-100">
              <button
                (click)="createProduct()"
                type="button"
                class="btn btn-outline-secondary flex-fill"
              >
                <i class="fa-solid fa-circle-plus h1"></i>
                <span style="white-space: pre-line">Add new product</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
