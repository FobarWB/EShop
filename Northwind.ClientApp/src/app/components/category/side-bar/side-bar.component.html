<aside class="sidebar flex-shrink-0 sticky-top py-3">
  <ul class="list-unstyled ps-0">
    <li class="mb-1">
      <a
        class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed p-2"
        data-bs-toggle="collapse"
        data-bs-target="#price-collapse"
        aria-expanded="false"
      >
        <span>Price</span>
      </a>
      <div class="collapse" id="price-collapse">
        <div class="p-2 price-slider">
          <ngx-slider
            [(value)]="minValue"
            [(highValue)]="maxValue"
            [options]="options"
          >
          </ngx-slider>
          <div class="d-flex flex-row align-items-center">
            <input
              (input)="minValueChanged($event)"
              [(ngModel)]="minValue"
              type="text"
              class="form-control"
              placeholder="Min Price"
            />
            <span class="mx-2">-</span>
            <input
              (input)="maxValueChanged($event)"
              [(ngModel)]="maxValue"
              type="text"
              class="form-control"
              placeholder="Max Price"
            />
            <button
              (click)="onPriceApplied()"
              type="button"
              class="btn btn-dark w-100 ms-4"
            >
              ОK
            </button>
          </div>
        </div>
      </div>
    </li>

    <li class="mb-1">
      <a
        class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed p-2"
        data-bs-toggle="collapse"
        data-bs-target="#availability-collapse"
        aria-expanded="false"
      >
        <span>Availability</span>
      </a>
      <div class="collapse" id="availability-collapse">
        <div class="p-2">
          <div class="form-check">
            <input
              [(ngModel)]="unitsInStock"
              class="form-check-input"
              type="checkbox"
              id="stockCheck"
              (change)="onFiltersApplied()"
            />
            <label class="form-check-label" for="stockCheck">
              Units in Stock
            </label>
          </div>
        </div>
      </div>
    </li>

    <li class="mb-1">
      <a
        class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed p-2"
        data-bs-toggle="collapse"
        data-bs-target="#discount-collapse"
        aria-expanded="false"
      >
        <span>Discount</span>
      </a>
      <div class="collapse" id="discount-collapse">
        <div class="p-2">
          <div class="form-check">
            <input
              [(ngModel)]="discounted"
              class="form-check-input"
              type="checkbox"
              id="discountCheck"
              (change)="onFiltersApplied()"
            />
            <label class="form-check-label" for="discountCheck">
              Discounted
            </label>
          </div>
        </div>
      </div>
    </li>
  </ul>
</aside>
