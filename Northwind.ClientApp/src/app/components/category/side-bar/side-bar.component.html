<aside class="sidebar flex-shrink-0 sticky-top">
  <ul class="list-unstyled ps-0">
    <li class="mb-1">
      <a
        class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed p-2"
        data-bs-toggle="collapse"
        data-bs-target="#price-collapse"
        aria-expanded="false"
      >
        <span>Price</span>
      </a>
      <div class="collapse" id="price-collapse">
        <div class="p-2">
          <ngx-slider
            [(value)]="minValue"
            [(highValue)]="maxValue"
            [options]="options"
          >
          </ngx-slider>
          <div class="d-flex mb-3">
            <div class="input-group me-2">
              <input
                [(ngModel)]="minValue"
                type="number"
                class="form-control"
                placeholder="Min Price"
              />
            </div>
            <div class="input-group">
              <input
                [(ngModel)]="maxValue"
                type="number"
                class="form-control"
                placeholder="Max Price"
              />
            </div>
            <div>
              <button
                (click)="onPriceApplied()"
                type="button"
                style="
                  padding: 12px 11px 12px 9px;
                  display: inline-block;
                  background: #2d2b33;
                  color: #fff;
                "
              >
                Ок
              </button>
            </div>
          </div>
        </div>
      </div>
    </li>

    <li class="mb-1">
      <a
        class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed p-2"
        data-bs-toggle="collapse"
        data-bs-target="#availability-collapse"
        aria-expanded="false"
      >
        <span>Availability</span>
      </a>
      <div class="collapse" id="availability-collapse">
        <div class="p-2">
          <div class="form-check">
            <input
              [(ngModel)]="unitsInStock"
              class="form-check-input"
              type="checkbox"
              id="stockCheck"
              (change)="onFiltersApplied()"
            />
            <label class="form-check-label" for="stockCheck">
              Units in Stock
            </label>
          </div>
        </div>
      </div>
    </li>

    <li class="mb-1">
      <a
        class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed p-2"
        data-bs-toggle="collapse"
        data-bs-target="#discount-collapse"
        aria-expanded="false"
      >
        <span>Discount</span>
      </a>
      <div class="collapse" id="discount-collapse">
        <div class="p-2">
          <div class="form-check">
            <input
              [(ngModel)]="discounted"
              class="form-check-input"
              type="checkbox"
              id="discountCheck"
              (change)="onFiltersApplied()"
            />
            <label class="form-check-label" for="discountCheck">
              Discounted
            </label>
          </div>
        </div>
      </div>
    </li>
  </ul>
</aside>
