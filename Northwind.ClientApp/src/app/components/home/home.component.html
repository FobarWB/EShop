<div class="album py-5 bg-light">
  <div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
      <div class="col d-flex align-items-stretch" *ngFor="let c of categories">
        <div class="card shadow-sm">
          <a>
            <img
              src="images/category{{ c.categoryId }}.jpeg"
              class="card-img-top"
              alt="{{ c.categoryName }}"
            />
          </a>
          <div class="card-body d-flex flex-column">
            <p class="card-text">{{ c.description }}</p>
            <div
              class="d-flex justify-content-between align-items-center mt-auto align-self-start"
            >
              <div class="btn-group">
                <button type="button" class="btn btn-sm btn-outline-secondary">
                  Edit
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col d-flex align-items-stretch">
        <div class="card shadow-sm w-100 text-center justify-content-center">
          <i class="fa-solid fa-circle-plus h1"></i>
        </div>
      </div>
    </div>
  </div>
</div>
