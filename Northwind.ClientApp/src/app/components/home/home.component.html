<app-edit> </app-edit>

<div class="album py-5 bg-light">
  <div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
      <div class="col d-flex align-items-stretch" *ngFor="let c of categories">
        <div class="card shadow-sm w-100">
          <div class="div-img">
            <a
              [routerLink]="[encodeCategoryName(c.categoryName), c.categoryId]"
            >
              <img
                src="images/category{{ c.categoryId }}.jpeg"
                class="card-img-top"
                alt="{{ c.categoryName }}"
              />
            </a>
          </div>
          <div class="card-body d-flex flex-column">
            <p class="card-text">{{ c.description }}</p>
            <div
              class="d-flex justify-content-between align-items-center mt-auto align-self-start"
            >
              <div class="btn-group">
                <!-- <button
                  type="button"
                  class="btn btn-sm btn-outline-secondary"
                  data-bs-toggle="modal"
                  data-bs-target="#exampleModal"
                >
                  Edit
                </button> -->
                <button
                  (click)="openModal(modalContent)"
                  type="button"
                  class="btn btn-sm btn-outline-secondary"
                >
                  Edit
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col d-flex align-items-stretch">
        <div
          class="card shadow-sm w-100 text-center justify-content-center new-category-card"
        >
          <i class="fa-solid fa-circle-plus h1"></i>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #modalContent let-data>
  <div>This is our custom modal content</div>
</ng-template>
