# nginx in the client container: serves the Angular build and proxies /api to the APIs
# over the internal Docker network (service names from docker-compose.yml).
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Tell the APIs the original client address and scheme (nginx is the entry point).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/products   { proxy_pass http://productapi:8080; }
    location /api/categories { proxy_pass http://categoryapi:8080; }
    location /api/carts      { proxy_pass http://shoppingcart:8080; }

    # SPA fallback: unknown paths like /beverages/c1 are Angular routes, not files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
