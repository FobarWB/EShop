# nginx in the client container: serves the Angular build and proxies /api to the APIs
# over the internal Docker network (service names from docker-compose.yml).
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's internal DNS. Names are resolved per request (through the variables below), not once at startup,
    # so nginx starts without the APIs and follows a recreated API container to its new IP address.
    resolver 127.0.0.11 valid=10s;
    set $productapi   http://productapi:8080;
    set $categoryapi  http://categoryapi:8080;
    set $shoppingcart http://shoppingcart:8080;

    # Tell the APIs the original client address and scheme (nginx is the entry point).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/products   { proxy_pass $productapi; }
    location /api/categories { proxy_pass $categoryapi; }
    location /api/carts      { proxy_pass $shoppingcart; }

    # SPA fallback: unknown paths like /beverages/c1 are Angular routes, not files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
