<header class="sticky-top shadow">
  <nav class="navbar navbar-expand-sm">
    <div class="layout d-flex">
      <a class="navbar-brand me-0" routerLink="">
        <i class="fa-solid fa-bowl-food fs-1">
          <span class="brand-text align-middle ms-2 fs-2">Food Shop</span>
        </i>
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-collapse collapse" id="navbarNav">
        <div class="nav-item dropdown ms-4">
          <a
            class="btn btn-categories dropdown-toggle"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <span>All categories</span>
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Action</a></li>
            <li><a class="dropdown-item" href="#">Another action</a></li>
            <li><a class="dropdown-item" href="#">Something else here</a></li>
          </ul>
        </div>
        <div class="nav-item flex-grow-1 ms-4">
          <div class="d-flex input-group">
            <input
              class="form-control input-search"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-search">Search</button>
          </div>
        </div>
        <div class="nav-item ms-auto d-flex align-items-center">
          <div class="nav-link ms-4">
            @if (auth.isAuthenticated()) {
              <div class="dropdown">
                <button class="btn d-flex align-items-center dropdown-toggle" type="button"
                  data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="bi bi-person-circle fs-2"></i>
                  <span class="ms-2">{{ auth.userName() }}</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><button class="dropdown-item" type="button" (click)="auth.signOut()">Sign out</button></li>
                </ul>
              </div>
            } @else {
              <button class="btn d-flex align-items-center" type="button" (click)="auth.signIn()">
                <i class="bi bi-person-circle fs-2"></i>
                <span class="ms-2">Sign in</span>
              </button>
            }
          </div>
          <div class="nav-link ms-4">
            <button class="btn btn-cart" [routerLink]="['/cart']">
              <i class="bi bi-cart fs-2"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
