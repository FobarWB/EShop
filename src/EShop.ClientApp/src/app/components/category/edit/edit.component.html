<form [formGroup]="categoryForm">
  <div class="mb-3">
    <label class="form-label">Category Name</label>
    <input
      type="text"
      id="categoryName"
      class="form-control"
      formControlName="categoryName"
    />
    @if (
      categoryForm.controls['categoryName'].invalid &&
      categoryForm.controls['categoryName'].touched
    ) {
    <div class="text-danger">
      Category Name is required and must be less than 15 characters
    </div>
    }
  </div>

  <div [class.mb-3]="category">
    <label class="form-label">Description</label>
    <textarea
      id="description"
      class="form-control"
      formControlName="description"
    ></textarea>
  </div>

  @if (category) {
  <div>
    <button type="button" (click)="delete()" class="btn btn-danger w-100">
      Delete
    </button>
  </div>
  }
</form>
